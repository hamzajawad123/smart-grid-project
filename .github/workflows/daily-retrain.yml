name: Daily gated retrain

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      # Empty checkout has no CSVs. Incremental ingest is ~14 recent days, all in
      # the test split (after 2025-08-31), so LightGBM would see 0 train rows.
      - name: Refresh full history
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/refresh_data.py --full
      - name: Train and promote only if better
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python scripts/gated_retrain.py
      - name: Upload pin and decision
        uses: actions/upload-artifact@v4
        with:
          name: peco-model-pin
          path: |
            models/production/
            models/candidate/decision.json
            models/candidate/metadata.json
