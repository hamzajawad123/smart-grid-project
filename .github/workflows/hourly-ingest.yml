name: Hourly ingest

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Refresh last 2 days
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/refresh_data.py
      - name: Upload tables
        uses: actions/upload-artifact@v4
        with:
          name: peco-hourly-tables
          path: |
            data/raw/peco_hourly_demand.csv
            data/raw/philadelphia_hourly_weather.csv
            data/processed/peco_clean.csv
            data/processed/peco_features.csv
            data/processed/drift_report.json
          if-no-files-found: warn
