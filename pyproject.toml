[project]
name = "smart-grid"
version = "0.1.0"
description = "PECO (PJM sub-BA) hourly demand forecasting pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "pyarrow>=14.0",
  "requests>=2.31",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
eda = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "statsmodels>=0.14",
  "holidays>=0.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
