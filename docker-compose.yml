services:
  api:
    build: .
    image: ${DOCKERHUB_USER:-local}/smart-grid:${TAG:-latest}
    command: python scripts/run_api.py
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SMART_GRID_ROOT: /app
      SMART_GRID_API_URL: http://api:8000
      API_HOST: "0.0.0.0"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./params.yaml:/app/params.yaml:ro

  ui:
    build: .
    image: ${DOCKERHUB_USER:-local}/smart-grid:${TAG:-latest}
    command: python scripts/run_ui.py
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      SMART_GRID_ROOT: /app
      SMART_GRID_API_URL: http://api:8000
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./params.yaml:/app/params.yaml:ro
      - ./frontend:/app/frontend
